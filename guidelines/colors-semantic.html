<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--primary-background-color);color:var(--primary-text-color);font:var(--font-text2-normal)}</style></head><body>
<div style="display:flex;gap:12px">
<div style="flex:1;min-width:0;border-radius:var(--border-radius-medium);overflow:hidden;border:1px solid var(--layout-border-color)"><div style="height:64px;background:var(--positive-color);"></div><div style="padding:8px 10px"><div style="font:var(--font-text3-medium)">Positive</div><div style="font:var(--font-text3-normal);color:var(--secondary-text-color)">#00854d · --positive-color</div></div></div>

<div style="flex:1;min-width:0;border-radius:var(--border-radius-medium);overflow:hidden;border:1px solid var(--layout-border-color)"><div style="height:64px;background:var(--warning-color);"></div><div style="padding:8px 10px"><div style="font:var(--font-text3-medium)">Warning</div><div style="font:var(--font-text3-normal);color:var(--secondary-text-color)">#ffcb00 · --warning-color</div></div></div>
</div>
</body></html>
