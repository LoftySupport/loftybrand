<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel">
const { Button, TextField, Tabs, Toggle, Label, AttentionBox, Chips, Checkbox } = window.LoftyDesignSystem_491d68;
function Demo(){
  const [tab,setTab]=React.useState('table');
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,alignItems:'start'}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
        <Button>Create job</Button><Button kind="secondary">Cancel</Button><Button kind="tertiary">More</Button><Button color="negative">Delete</Button>
      </div>
      <Tabs tabs={[{id:'table',label:'Table'},{id:'timeline',label:'Timeline'},{id:'map',label:'Map'}]} value={tab} onChange={setTab} />

      <div style={{display:'flex',gap:16,alignItems:'center'}}><Toggle checked label="Email digests" /><Checkbox label="Notify crew" checked /></div>
      <AttentionBox type="warning" title="Two jobs unassigned" text="Assign a crew before publishing." iconBasePath="../assets/icons" style={{gridColumn:'1 / -1'}} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
