<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Lofty landing, Deep Eco</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Onest,Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</helmet>
<div style="width: 1440px; height: 900px">
<dc-import name="Main" theme="{{theme}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["eco","twilight","light"],"default":"eco","section":"Theme"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'eco' };
  }
}
</script>
</body>
</html>
