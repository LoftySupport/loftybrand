<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body)} .wrap{padding:24px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start} button{font-family:var(--font-body)}</style>
</head>
<body>
<div class="wrap">
<button type="button" style="height:40px;padding:0 20px;border:0;border-radius:var(--radius-pill);background:var(--action);color:var(--on-action);font-size:14px;font-weight:700">Chase engineer</button>
<button type="button" style="height:40px;padding:0 20px;border:0;border-radius:var(--radius-pill);background:var(--eco-green);color:#ffffff;font-size:14px;font-weight:700">Prep me</button>
<button type="button" style="height:40px;padding:0 20px;border:0;border-radius:var(--radius-pill);background:var(--plum);color:#ffffff;font-size:14px;font-weight:700">Show what's blocked</button>
<button type="button" style="height:40px;padding:0 16px;border:1px solid var(--line-control);border-radius:var(--radius-pill);background:transparent;color:var(--ink);font-size:13px;font-weight:600">Hold the pour</button>
</div>
</body>
</html>
