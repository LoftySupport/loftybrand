<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--primary-background-color);font:var(--font-text2-normal);color:var(--primary-text-color)}</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Table, Slider, Label, Avatar, IconButton } = window.LoftyDesignSystem_491d68;

const rows = [
  {id:1,job:'Northline resurfacing',owner:'AK',status:'In progress',due:'12 Sep'},
  {id:2,job:'Depot 2 inspection',owner:'LM',status:'Complete',due:'8 Sep'},
  {id:3,job:'Bridge joint repair',owner:'JD',status:'Overdue',due:'2 Sep'}
];
const tone = {'In progress':'primary','Complete':'positive','Overdue':'negative'};
function Demo(){
  const [r,setR] = React.useState(18);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Table rows={rows} columns={[
        {id:'job',title:'Job'},
        {id:'owner',title:'Owner',width:90,render:row=><Avatar text={row.owner} size="small" />},
        {id:'status',title:'Status',width:130,render:row=><Label text={row.status} color={tone[row.status]} />},
        {id:'due',title:'Due',width:90},
        {id:'act',title:'',width:56,align:'right',render:()=><IconButton icon="MoreActions" ariaLabel="More" size="small" iconBasePath="../../assets/icons" />}
      ]} />
      <Slider label="Search radius (km)" value={r} onChange={setR} min={1} max={50} showValue />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
