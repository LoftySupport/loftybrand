<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--primary-background-color);font:var(--font-text2-normal);color:var(--primary-text-color)}</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { MultiStepIndicator, Steps, Text } = window.LoftyDesignSystem_491d68;
function Demo(){
  const [i,setI]=React.useState(1);
  const status = n => n < i ? 'fulfilled' : n === i ? 'active' : 'pending';
  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      <MultiStepIndicator onClick={setI} steps={[
        { titleText:'Job details', status:status(0) },
        { titleText:'Crew', subtitleText:'2 assigned', status:status(1) },
        { titleText:'Schedule', status:status(2) }
      ]} />
      <MultiStepIndicator type="compact" steps={[
        { status:'fulfilled' },{ status:'active' },{ status:'pending' },{ status:'pending' }
      ]} style={{width:220}} />
      <div style={{border:'1px solid var(--layout-border-color)',borderRadius:'var(--border-radius-medium)',padding:16,maxWidth:380}}>
        <Steps activeStep={i%3} onChange={n=>setI(n%3)} steps={[
          <Text>Name the job and pick a site.</Text>,
          <Text>Assign a crew from any depot.</Text>,
          <Text>Set the start date and publish.</Text>
        ]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
