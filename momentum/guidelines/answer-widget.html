<!-- @dsCard group="App components" viewport="1100x200" name="Answer widget" subtitle="One sentence, then ring, figure and risk tiles, then the action" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AnswerWidget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Outfit:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-body)} .wrap{padding:24px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start} button{font-family:var(--font-body)}</style>
</head>
<body>
<div class="wrap" style="flex-direction:column">
<span style="font-size:15px;line-height:23px">68% built and 4 days behind plan. One thing is holding up the slab pour.</span>
<div style="display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;width:640px;max-width:100%">
<div style="border-radius:var(--radius-l);background:var(--surface-card);border:1px solid var(--edge-glass);padding:16px;display:flex;align-items:center;gap:14px"><svg width="72" height="72" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--line)" stroke-width="10"></circle><circle cx="42" cy="42" r="34" fill="none" stroke="var(--crisp-orange)" stroke-width="10" stroke-linecap="round" stroke-dasharray="145 214" transform="rotate(-90 42 42)"></circle></svg><span style="display:flex;flex-direction:column"><span style="font-family:var(--font-display);font-size:22px;font-weight:600">68%</span><span style="font-size:12px;color:var(--ink-muted)">Build · slab</span></span></div>
<div style="border-radius:var(--radius-l);background:var(--surface-card);border:1px solid var(--edge-glass);padding:16px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-size:12px;color:var(--ink-muted)">Budget used</span><span style="font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-1px">72%</span></div>
<div style="border-radius:var(--radius-l);background:var(--plum);color:#ffffff;padding:16px;display:flex;flex-direction:column;justify-content:space-between"><span style="font-size:12px;color:rgba(255,255,255,0.72)">Against plan</span><span style="font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-1px;color:var(--crisp-orange)">-4 days</span></div>
</div></div>
</body>
</html>
