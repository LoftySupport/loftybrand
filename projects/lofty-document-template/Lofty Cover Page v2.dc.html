<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../../tokens/fonts.css">
<link rel="stylesheet" href="../../tokens/colors.css">
<link rel="stylesheet" href="../../tokens/typography.css">
<link rel="stylesheet" href="../../tokens/spacing.css">
<link rel="stylesheet" href="../../tokens/radius.css">
<link rel="stylesheet" href="../../tokens/shadows.css">
<link rel="stylesheet" href="../../tokens/motion.css">
<link rel="stylesheet" href="../../tokens/base.css">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<style>
  doc-page:not(:defined){visibility:hidden}
  a{color:#414042;text-decoration:underline}
  a:hover{color:#f47e63;text-decoration:underline}
</style>
<script src="./doc-page.js"></script>
</helmet>

<doc-page size="a4" margin="0">
<div style="position:relative;overflow:hidden;box-sizing:border-box;min-height:11.69in;padding:1cm 0.7in;font-family:Montserrat,Arial,sans-serif;font-weight:300;font-size:10.5pt;line-height:1.6;color:#414042;letter-spacing:-0.01em">

  

  <div style="position:relative">
    <img src="../../assets/brand/lofty-logo-orange.png" alt="Lofty" style="height:46px;width:auto;display:block;margin:0 0 300px">

    <div style="display:flex;align-items:center;gap:10px;margin:0 0 16px">
      <span style="font-family:'Century Gothic','Questrial','Futura',sans-serif;font-weight:600;font-size:8.5pt;letter-spacing:0.14em;text-transform:uppercase;color:#f47e63">Report</span>
    </div>
    <h1 style="font-family:'Century Gothic','Questrial','Futura',sans-serif;font-weight:600;font-size:32pt;line-height:1.12;letter-spacing:-0.01em;color:#414042;margin:0 0 14px;max-width:22em">Document title goes here</h1>
    <p style="font-size:13pt;line-height:1.45;color:#67666a;margin:0 0 320px;max-width:30em">A one-line subtitle saying what this document is for and who it is written for.</p>

    <table style="width:100%;border-collapse:collapse;font-size:9.5pt">
      <tbody>
        <tr>
          <td style="width:22%;border-top:1px solid #e1e1d9;padding:8px 12px 8px 0;color:#8a898d">Prepared for</td>
          <td style="border-top:1px solid #e1e1d9;padding:8px 32px 8px 0;font-weight:600">Client or project name</td>
          <td style="width:22%;border-top:1px solid #e1e1d9;padding:8px 12px 8px 0;color:#8a898d">Date issued</td>
          <td style="border-top:1px solid #e1e1d9;padding:8px 0;font-weight:600">3 September 2026</td>
        </tr>
        <tr>
          <td style="border-top:1px solid #e1e1d9;padding:8px 12px 8px 0;color:#8a898d">Prepared by</td>
          <td style="border-top:1px solid #e1e1d9;padding:8px 32px 8px 0;font-weight:600">Author name, role</td>
          <td style="border-top:1px solid #e1e1d9;padding:8px 12px 8px 0;color:#8a898d">Reference</td>
          <td style="border-top:1px solid #e1e1d9;padding:8px 0;font-weight:600">LOF-0000</td>
        </tr>
        <tr>
          <td style="border-top:1px solid #e1e1d9;border-bottom:1px solid #e1e1d9;padding:8px 12px 8px 0;color:#8a898d">Version</td>
          <td style="border-top:1px solid #e1e1d9;border-bottom:1px solid #e1e1d9;padding:8px 32px 8px 0;font-weight:600">1.0</td>
          <td style="border-top:1px solid #e1e1d9;border-bottom:1px solid #e1e1d9;padding:8px 12px 8px 0;color:#8a898d">Status</td>
          <td style="border-top:1px solid #e1e1d9;border-bottom:1px solid #e1e1d9;padding:8px 0;font-weight:600">Draft for review</td>
        </tr>
        <tr>
          <td colspan="4" style="padding:14px 0 0;font-size:8pt;color:#8a898d">Commercial in confidence</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
</doc-page>

</x-dc>

</html>
