<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:16px;background:var(--primary-background-color);font:var(--font-text2-normal);color:var(--primary-text-color)}</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Icon, Avatar, Chips, Label, Tooltip, Loader } = window.LoftyDesignSystem_491d68;

const Row = ({children, label}) => (
  <div style={{display:'flex',flexDirection:'column',gap:4}}>
    <span style={{font:'var(--font-text3-medium)',color:'var(--secondary-text-color)'}}>{label}</span>
    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>{children}</div>
  </div>
);
function Demo(){
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Row label="Button — kinds">
        <Button>Primary</Button>
        <Button kind="secondary">Secondary</Button>
        <Button kind="tertiary">Tertiary</Button>
        <Button color="secondary">Eco Green</Button>
        <Button color="negative">Delete</Button>
        <Button disabled>Disabled</Button>
        <Button loading>Saving</Button>
      </Row>
      <Row label="Button — sizes & icons">
        <Button size="xs">XS</Button>
        <Button size="small" leftIcon={<Icon name="Add" size={14} />}>Small</Button>
        <Button size="medium" leftIcon={<Icon name="Add" size={16} />}>Medium</Button>
        <Button size="large">Large</Button>
        <Button kind="secondary" active>Active</Button>
      </Row>
      <Row label="IconButton, Avatar, Loader">
        <IconButton icon="MoreActions" ariaLabel="More" />
        <IconButton icon="Filter" ariaLabel="Filter" active />
        <IconButton icon="Add" kind="primary" />
        <IconButton icon="Edit" kind="secondary" />
        <IconButton icon="Delete" ariaLabel="Delete" disabled />
        <Avatar text="AK" />
        <Avatar text="LM" size="small" backgroundColor="var(--primary-color)" />
        <Avatar text="JD" type="square" online />
        <Loader size={24} />
      </Row>
      <Row label="Chips, Label, Tooltip">
        <Chips label="Site inspection" onDelete={()=>{}} />
        <Chips label="Overdue" color="var(--negative-color-selected)" />
        <Chips label="Depot 2" color="var(--lofty-green-selected)" size="small" />
        <Label text="New" />
        <Label text="Complete" color="positive" />
        <Label text="Draft" kind="line" color="dark" size="small" />
        <Tooltip content="Crisp Orange, 240px max"><Button kind="secondary" size="small">Hover me</Button></Tooltip>
      </Row>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
