<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--primary-background-color);color:var(--primary-text-color);font:var(--font-text2-normal)}.p{display:flex;align-items:center;justify-content:center;height:96px;border-radius:var(--border-radius-medium);box-sizing:border-box}.p img{height:40px;display:block}.c{font:var(--font-text3-normal);color:var(--secondary-text-color);margin-top:8px}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<div><div class="p" style="border:1px solid var(--layout-border-color)"><img src="../assets/brand/lofty-logo-orange.png" alt="Lofty, Crisp Orange"></div><div class="c">Crisp Orange on white · primary</div></div>
<div><div class="p" style="border:1px solid var(--layout-border-color)"><img src="../assets/brand/lofty-logo-black.png" alt="Lofty, Foundation Black"></div><div class="c">Foundation Black on white · mono</div></div>
<div><div class="p" style="background:var(--lofty-foundation-black)"><img src="../assets/brand/lofty-logo-white.png" alt="Lofty, white on Foundation Black"></div><div class="c">White on Foundation Black · reverse</div></div>
<div><div class="p" style="background:var(--lofty-crisp-orange)"><img src="../assets/brand/lofty-logo-white.png" alt="Lofty, white on Crisp Orange"></div><div class="c">White on Crisp Orange · reverse</div></div>
</div>
<div class="c" style="margin-top:16px">Same 40px lockup in every panel. White on Eco Green is allowed for small highlight blocks only; orange on green and any logo on Mid Grey are never used.</div>
</body></html>
